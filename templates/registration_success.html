{% extends 'base.html' %}
{% block title %}Registration Successful | SecureVote{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body text-center p-5">
                <div class="mb-4">
                    <div class="icon-box bg-success-subtle text-success mx-auto">✅</div>
                </div>
                <h2 class="mb-4">Registration Successful</h2>

                <div class="text-start mx-auto mb-4" style="max-width: 420px;">
                    <p class="mb-2"><strong>Name:</strong> {{ name }}</p>
                    <p class="mb-2"><strong>Email:</strong> {{ email }}</p>
                    <p class="mb-3"><strong>Your Voter ID is:</strong></p>
                    <div class="alert alert-primary text-center fw-bold fs-5 mb-0">{{ voter_id }}</div>
                </div>

                <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg mt-3">Go to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
